name: Deploy to ECS

on:
  workflow_run:
    workflows: ["Build & Push to ECR"] 
    types:
      - completed

jobs:
  deploy-to-ecs:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }} 
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Download current Task Definition
        run: |
          aws ecs describe-task-definition --task-definition fastapi-fargate --query taskDefinition > task-definition.json

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: fastapi-app
          image: ${{ secrets.ECR_REGISTRY }}/topu-devops-assesment:${{ github.sha }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: fastapi-fargate-service 
          cluster: fastapi-fargate-cluster 
          wait-for-service-stability: true